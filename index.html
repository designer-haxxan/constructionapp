<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f14">
  <meta name="description" content="Materials ledger for a building-materials business: purchases from dealers, bills to customers, customer and dealer ledgers, stock and reports.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://eposwala.com https://cdn.jsdelivr.net; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>Materials Ledger</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <!-- Sign-in -->
  <section id="login" class="login" hidden>
    <div class="blueprint" aria-hidden="true"></div>
    <div class="login-art" aria-hidden="true">
      <svg viewBox="0 0 640 420" class="skyline">
        <g class="crane">
          <rect x="520" y="40" width="10" height="260" class="steel"/>
          <rect x="420" y="40" width="210" height="10" class="steel"/>
          <line x1="470" y1="50" x2="470" y2="110" class="cable"/>
          <rect x="452" y="110" width="36" height="22" rx="3" class="hook"/>
        </g>
        <g class="walls">
          <rect class="b b1" x="40" y="220" width="90" height="180"/>
          <rect class="b b2" x="140" y="160" width="110" height="240"/>
          <rect class="b b3" x="260" y="200" width="80" height="200"/>
          <rect class="b b4" x="350" y="120" width="130" height="280"/>
        </g>
        <g class="windows">
          <rect class="win" x="58" y="244" width="14" height="14"/><rect class="win" x="84" y="244" width="14" height="14"/>
          <rect class="win" x="58" y="280" width="14" height="14"/><rect class="win" x="84" y="280" width="14" height="14"/>
          <rect class="win" x="160" y="186" width="14" height="14"/><rect class="win" x="190" y="186" width="14" height="14"/>
          <rect class="win" x="160" y="226" width="14" height="14"/><rect class="win" x="190" y="226" width="14" height="14"/>
          <rect class="win" x="160" y="266" width="14" height="14"/><rect class="win" x="190" y="266" width="14" height="14"/>
          <rect class="win" x="280" y="226" width="14" height="14"/><rect class="win" x="302" y="226" width="14" height="14"/>
          <rect class="win" x="372" y="146" width="14" height="14"/><rect class="win" x="402" y="146" width="14" height="14"/>
          <rect class="win" x="432" y="146" width="14" height="14"/><rect class="win" x="372" y="190" width="14" height="14"/>
          <rect class="win" x="402" y="190" width="14" height="14"/><rect class="win" x="432" y="190" width="14" height="14"/>
        </g>
        <line class="ground" x1="0" y1="402" x2="640" y2="402"/>
      </svg>
    </div>
    <div class="login-card">
      <div class="login-brand">
        <img class="logo logo-login" src="img/logo.png" width="380" height="145" alt="Shakeel Sons Building Materials">
        <div>
          <div class="login-title">Materials Ledger</div>
          <div class="login-sub">Shakeel Sons · Building materials</div>
        </div>
      </div>
      <form id="login-form" class="form" novalidate>
        <div class="field">
          <label for="login-user">Username</label>
          <input id="login-user" name="username" autocomplete="username" autocapitalize="off" required>
        </div>
        <div class="field">
          <label for="login-pass">Password</label>
          <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="form-error" id="login-error" hidden></div>
        <button class="btn btn-primary btn-block" type="submit" id="login-btn"><span>Sign in</span> <i class="bi bi-arrow-right"></i></button>
        <p class="login-note" id="login-note"></p>
      </form>
    </div>
  </section>

  <!-- Application shell -->
  <div id="app" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand">
        <img class="logo logo-side" src="img/logo.png" width="380" height="145" alt="">
        <div>
          <div class="brand-name" id="brand-name">Shakeel Sons</div>
          <div class="brand-sub">Materials ledger</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="user"><span class="avatar" id="user-initial">S</span><span id="user-name"></span></div>
        <button class="btn btn-ghost btn-sm btn-block" id="signout" type="button"><i class="bi bi-box-arrow-right"></i> Sign out</button>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu"><i class="bi bi-list"></i></button>
        <div class="crumb">
          <div class="crumb-section" id="crumb-section"></div>
          <h1 id="page-title"></h1>
        </div>
        <div class="top-actions">
          <button class="btn btn-accent" data-go="#/bills/new"><i class="bi bi-receipt"></i><span class="hide-sm"> New bill</span></button>
          <button class="btn btn-ghost" data-go="#/purchases/new"><i class="bi bi-bag-plus"></i><span class="hide-sm"> Purchase</span></button>
        </div>
      </header>
      <div class="hazard" aria-hidden="true"></div>
      <main id="view" tabindex="-1"></main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <div id="print-area" aria-hidden="true"></div>
</body>
</html>
